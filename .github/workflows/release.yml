name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). The tag is created on the selected branch if it does not exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno task test
      - run: deno task build --strict
      - name: Checksums
        working-directory: dist
        run: sha256sum SKK-JISYO.emoji-ja SKK-JISYO.emoji-ja.utf8 > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^unicode_emoji_version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' data/meta.yaml)
          notes="Unicode Emoji ${version} の日本語 SKK 辞書です。

          - \`SKK-JISYO.emoji-ja.utf8\`: UTF-8 版（AquaSKK / macSKK / libskk / DDSKK など）
          - \`SKK-JISYO.emoji-ja\`: EUC-JP 版（候補は Emacs Lisp 式。DDSKK 用）"
          gh release create "$TAG" dist/SKK-JISYO.emoji-ja dist/SKK-JISYO.emoji-ja.utf8 dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG (Emoji ${version})" --notes "$notes" --generate-notes
