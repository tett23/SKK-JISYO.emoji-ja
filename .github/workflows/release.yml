name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the release notes read the commits since the previous release (ADR 0005)
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno task test
      - run: deno task build --strict
      - name: Checksums
        working-directory: dist
        run: sha256sum SKK-JISYO.emoji-ja SKK-JISYO.emoji-ja.utf8 LICENSE LICENSE-Unicode.txt LICENSE-Mozc.txt LICENSE-emoji-data.txt > SHA256SUMS

      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --exclude-drafts --json tagName,createdAt \
                   --jq "map(select(.tagName != \"${GITHUB_REF_NAME}\")) | sort_by(.createdAt) | last | .tagName // empty")
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          git log --no-merges --format='%H%x09%s' "$range" > commits.tsv
          deno task notes --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --commits commits.tsv \
            --utf8 dist/SKK-JISYO.emoji-ja.utf8 --euc dist/SKK-JISYO.emoji-ja --prev-tag "$prev" > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^unicode_emoji_version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' data/meta.yaml)
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $flags --title "$GITHUB_REF_NAME (Emoji ${version})" --notes-file notes.md \
            dist/SKK-JISYO.emoji-ja dist/SKK-JISYO.emoji-ja.utf8 \
            dist/LICENSE dist/LICENSE-Unicode.txt dist/LICENSE-Mozc.txt dist/LICENSE-emoji-data.txt dist/SHA256SUMS
