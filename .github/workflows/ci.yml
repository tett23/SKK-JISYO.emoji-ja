name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/ tests/
      - run: deno task test
      - run: deno task build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: dictionaries
          path: dist/
          if-no-files-found: error

  node:
    name: Node.js
    runs-on: ubuntu-latest
    needs: deno
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build -- --strict --out-dir dist-node
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: dist-deno
      - name: Deno and Node.js outputs are identical
        run: diff -r dist-deno dist-node

  adr:
    name: ADR
    # workflow_dispatch has no commit range to check
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: tett23/adr-guard@v0.8.3
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          allow-status: true
          allow-links: true
