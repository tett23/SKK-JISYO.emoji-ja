name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno:
    name: Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno install
      - run: deno fmt --check
      - run: deno lint
      - run: deno check src/ tests/
      - run: deno task test
      - run: deno task build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: dictionaries
          path: dist/
          if-no-files-found: error

  node:
    name: Node.js
    runs-on: ubuntu-latest
    needs: deno
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build -- --strict --out-dir dist-node
      - uses: actions/download-artifact@v4
        with:
          name: dictionaries
          path: dist-deno
      - name: Deno and Node.js outputs are identical
        run: diff -r dist-deno dist-node
